
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>AI 同声传译 · 实时字幕</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Prevent the entire page from bouncing on mobile */
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed; /* Nuclear option to stop iOS address bar shifts */
        top: 0;
        left: 0;
      }

      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1f2937; }
      ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

      .glass-panel {
        background: rgba(17, 24, 39, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      /* ============================================
         自定义动画 - 用于打字光标、波纹、呼吸等效果
         ============================================ */

      /* 实时翻译时的打字光标 */
      @keyframes caret-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .caret-blink {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: currentColor;
        margin-left: 2px;
        vertical-align: text-bottom;
        animation: caret-blink 1s infinite;
        border-radius: 1px;
      }

      /* Empty state 上的呼吸光环 */
      @keyframes breath-glow {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.08); opacity: 0.9; }
      }
      .breath-glow { animation: breath-glow 3s ease-in-out infinite; }

      /* 录音中的红点扩散波纹 */
      @keyframes pulse-ring {
        0% { transform: scale(0.85); opacity: 0.8; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      .pulse-ring { animation: pulse-ring 1.5s ease-out infinite; }

      /* 状态点 idle 时柔和呼吸 */
      @keyframes soft-pulse {
        0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
        50% { opacity: 0.9; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      }
      .soft-pulse { animation: soft-pulse 2s ease-out infinite; }

      /* 按钮的 ripple-like focus ring */
      .focus-ring:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px #0a0f1c, 0 0 0 4px rgba(59, 130, 246, 0.6);
      }

      /* 设置面板的 backdrop 渐显 */
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-up { animation: fade-up 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }

      /* 标题底部蓝紫渐变光晕 */
      @keyframes shimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .shimmer-text {
        background: linear-gradient(90deg, #60a5fa, #a78bfa, #60a5fa);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 6s linear infinite;
      }

      /* 空闲音频可视化的占位条 */
      @keyframes idle-bar {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      .idle-bar { transform-origin: bottom; animation: idle-bar 1.6s ease-in-out infinite; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-950 text-white">
    <div id="root" class="h-full w-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
